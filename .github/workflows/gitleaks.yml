name: Gitleaks

# Scans each pull request's diff for committed secrets. Complements GitHub's
# own secret scanning / push protection (already enabled on this repo) with a
# second, independently-maintained ruleset; gitleaks-action is free for
# public repositories.

on:
  pull_request:

permissions:
  contents: read
  # gitleaks-action uses GITHUB_TOKEN to comment inline on the PR when it
  # finds a leak; without this it silently falls back to the job
  # summary/artifact only.
  pull-requests: write

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
