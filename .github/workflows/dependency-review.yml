name: Dependency Review

# Fails a pull request that introduces a dependency with a known
# vulnerability or a disallowed license, using the same advisory database as
# Dependabot alerts but checked at merge time rather than on a schedule.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Scan dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependencies
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
