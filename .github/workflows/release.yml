name: Release

# Builds a signed release APK when a version tag is pushed and attaches it to
# a GitHub Release. The tag must match versionName in app/build.gradle.kts
# (tag v0.1.0 <-> versionName "0.1.0").
#
# The job runs against the "release" environment, which requires manual
# approval before it starts: a tag pushed by a compromised write-capable
# token still can't reach the signing secrets without a human clicking
# approve first.
#
# Required repository secrets:
#   RELEASE_KEYSTORE_BASE64    base64 of the .jks upload keystore
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi

      # The self-updater offers any release whose versionName is newer, but
      # Android refuses an APK whose versionCode isn't higher than the
      # installed one — so a missed versionCode bump ships a release every
      # updater offers and then fails to install. Compare with the previous
      # version tag. Tags already published are never re-read from this
      # checkout, so the previous tag's file is fetched on its own.
      - name: Check versionCode increased since the previous release
        run: |
          current=$(sed -n 's/^ *versionCode = \([0-9][0-9]*\) *$/\1/p' app/build.gradle.kts)
          if [ -z "$current" ]; then
            echo "::error::Could not read versionCode from app/build.gradle.kts"
            exit 1
          fi
          previous_tag=$(git ls-remote --tags --refs origin 'refs/tags/v*' \
            | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | awk -v cur="$GITHUB_REF_NAME" '$0 == cur { exit } { prev = $0 } END { print prev }')
          if [ -z "$previous_tag" ]; then
            echo "No earlier version tag; nothing to compare versionCode $current with."
            exit 0
          fi
          git fetch --quiet --no-tags --depth=1 origin "refs/tags/$previous_tag"
          previous=$(git show 'FETCH_HEAD^{commit}:app/build.gradle.kts' \
            | sed -n 's/^ *versionCode = \([0-9][0-9]*\) *$/\1/p')
          if [ -z "$previous" ]; then
            echo "::error::Could not read versionCode from $previous_tag"
            exit 1
          fi
          if [ "$current" -le "$previous" ]; then
            echo "::error::versionCode $current is not higher than $previous_tag's $previous. Bump versionCode in app/build.gradle.kts."
            exit 1
          fi
          echo "versionCode $current > $previous ($previous_tag)"

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      # A release build never writes the cache, so a tag cannot poison it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Decode the keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify the APK signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk"
          cp "$apk" "MyRunningApp-$GITHUB_REF_NAME.apk"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "MyRunningApp-$GITHUB_REF_NAME.apk" \
            --title "$GITHUB_REF_NAME" --generate-notes

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
